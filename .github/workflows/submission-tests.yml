name: Submission build and tests

on:
  push:
    branches: [submission]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout submission
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore GmachManagement.slnx
      - name: Build
        run: dotnet build GmachManagement.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test GmachManagement.slnx --no-restore --configuration Release --logger "trx;LogFileName=submission-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
