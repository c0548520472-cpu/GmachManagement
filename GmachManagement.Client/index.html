
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>ניהול הגמ"ח</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>ניהול הגמ"ח</h1>
            <nav class="site-nav" aria-label="ניווט ראשי"><button id="homeNav" class="secondary" type="button">דף הבית</button><button id="loginNav" class="secondary" type="button">הרשמה / התחברות</button><button id="myLoansNav" class="secondary" type="button" hidden>ההשאלות שלי</button><button id="adminNav" class="secondary" type="button" hidden>ניהול גמ״ח</button></nav><div id="userArea">
                <span id="welcomeText"></span>
                <button id="logoutBtn" class="secondary" hidden>
                    התנתקות
                </button>
            </div>
        </div>
    </header>

    <main class="container">

        <section id="authSection" class="auth-card">
            <h2>ברוכים הבאים</h2>
            <p class="muted">התחברו כדי לנהל השאלות ופריטים</p>

            <div class="tabs">
                <button id="loginTab" class="tab active">
                    התחברות
                </button>
                <button id="registerTab" class="tab">
                    הרשמה
                </button>
            </div>

            <form id="authForm">
                <div id="nameGroup" hidden>
                    <label for="fullName">שם מלא</label>
                    <input id="fullName" type="text">
                </div>

                <div id="ownerRegistration" hidden><label><input id="registerOwner" type="checkbox"> אני בעל גמ״ח</label><div id="ownerFields" hidden><label for="gmachName">שם הגמ״ח</label><input id="gmachName" maxlength="150"><label for="gmachCity">עיר</label><input id="gmachCity" maxlength="100"></div></div>
                <label for="email">כתובת אימייל</label>
                <input id="email" type="email" required>

                <label for="password">סיסמה</label>
                <div class="password-field"><input id="password" type="password" required autocomplete="current-password"><label class="password-toggle"><input id="showPassword" type="checkbox"> הצג סיסמה</label></div>

                <button type="submit" class="primary full-width"
                        id="authSubmit">
                    התחברות
                </button>
            </form>

            <button id="forgotPasswordBtn" type="button" class="secondary">שכחתי סיסמה</button>
            <form id="forgotPasswordForm" hidden>
                <label for="resetEmail">כתובת אימייל</label><input id="resetEmail" type="email" required>
                <button type="submit" class="primary">שליחת קישור לאיפוס</button>
            </form>
            <form id="resetPasswordForm" hidden>
                <label for="newPassword">סיסמה חדשה</label><input id="newPassword" type="password" minlength="8" required><label class="password-toggle"><input id="showNewPassword" type="checkbox"> הצג סיסמה</label>
                <button type="submit" class="primary">עדכון סיסמה</button>
            </form>
            <p id="authMessage" class="message"
               role="status" aria-live="polite"></p>
        </section>

        <section id="dashboardSection" hidden>
            <div class="page-heading">
                <div>
                    <h2>קטלוג הפריטים</h2>
                    <p class="muted">
                        חיפוש פריטים והשאלת עותקים זמינים
                    </p>
                </div>
            </div>

            <section class="auth-card wide-card" id="gmachDirectory"><h2>גמ״חים לפי עיר</h2><div class="toolbar"><input id="citySearch" placeholder="חיפוש לפי עיר"><input id="gmachSearch" placeholder="שם גמ״ח"><button id="findGmachs" type="button" class="primary">חיפוש גמ״חים</button></div><div id="gmachList" class="items-grid"></div><div id="gmachDetails" class="items-grid"></div></section>
            <div class="toolbar">
                <input id="searchInput" type="search"
                       placeholder="חיפוש פריט...">

                <label for="categoryFilter">סוג גמ״ח</label><select id="categoryFilter"><option value="">כל הסוגים</option></select>
                <label class="checkbox-label">
                    <input id="availableOnly"
                           type="checkbox">
                    זמינים בלבד
                </label>

                <button id="searchBtn" class="primary">
                    חיפוש
                </button>
            </div>

            <p id="itemsMessage" class="message"
               role="status" aria-live="polite"></p>

            <div id="itemsGrid" class="items-grid"></div>

            <div class="pagination">
                <button id="prevPage" class="secondary">
                    הקודם
                </button>
                <span id="pageLabel">עמוד 1</span>
                <button id="nextPage" class="secondary">
                    הבא
                </button>
            </div>


            <section id="myLoansSection" class="auth-card wide-card" hidden><h2>ההשאלות שלי מהגמ״ח</h2><p id="myLoansMessage" class="message" role="status"></p><div id="myLoansList" class="items-grid"></div></section>
            <section id="adminSection" class="auth-card wide-card" hidden style="margin-top:24px">
                <h2>ניהול גמ"ח</h2>
                <div id="ownerGmachInfo"></div><form id="claimGmachForm" hidden><h3>שיוך גמ״ח לחשבון קיים</h3><label for="claimGmachName">שם הגמ״ח</label><input id="claimGmachName" maxlength="150" required><label for="claimGmachCity">עיר</label><input id="claimGmachCity" maxlength="100" required><button type="submit" class="primary">יצירת הגמ״ח שלי</button></form><div id="ownerManagement" hidden><form id="excelImportForm" enctype="multipart/form-data"><label for="excelFile">ייבוא פריטים מ־Excel (עמודה A: שם פריט, עמודה B: תיאור)</label><input id="excelFile" type="file" accept=".xlsx" required><button class="primary" type="submit">ייבוא Excel</button></form>
                <form id="adminItemForm">
                    <label for="adminItemName">שם פריט</label><input id="adminItemName" required maxlength="150">
                    <label for="adminItemDescription">תיאור</label><input id="adminItemDescription">
                    <button class="primary" type="submit">הוספת פריט</button>
                </form>
                </div><p id="adminMessage" class="message" role="status"></p>
                <div id="adminItems"></div>
                <h3>השאלות פעילות</h3>
                <div id="adminLoans"></div>
            </section>
            <section id="personalSection" class="auth-card wide-card" style="margin-top:24px">
                <h2>ההשאלות האישיות שלי</h2>
                <p class="muted">מעקב אחר פריטים ששאלתי או השאלתי באופן פרטי</p>
                <form id="personalForm">
                    <label for="personalParty">שם האדם</label>
                    <input id="personalParty" type="text" maxlength="150" required>
                    <label for="personalItem">תיאור הפריט</label>
                    <input id="personalItem" type="text" maxlength="500" required>
                    <label for="personalType">סוג פעולה</label>
                    <select id="personalType">
                        <option value="1">שאלתי ממישהו</option>
                        <option value="2">השאלתי למישהו</option>
                    </select>
                    <label for="personalAmount">סכום (אם מדובר בהלוואת כסף)</label>
                    <input id="personalAmount" type="number" min="0.01" step="0.01">
                    <label for="personalDate">תאריך ההשאלה</label>
                    <input id="personalDate" type="date" required>
                    <label for="personalReminder">תאריך תזכורת (אופציונלי)</label>
                    <input id="personalReminder" type="date">
                    <button class="primary" type="submit">שמירת השאלה אישית</button>
                </form>
                <p id="personalMessage" class="message" role="status" aria-live="polite"></p>
                <div id="personalList"></div>
            </section>
        </section>

        <dialog id="borrowDialog">
            <form id="borrowForm">
                <h2>השאלת פריט</h2>
                <p id="borrowItemName"></p>

                <label for="returnDate">
                    תאריך החזרה צפוי
                </label>
                <input id="returnDate" type="date" required>

                <p id="borrowMessage" class="message"
                   role="status" aria-live="polite"></p>

                <div class="dialog-actions">
                    <button type="button" id="cancelBorrow"
                            class="secondary">
                        ביטול
                    </button>
                    <button type="submit" class="primary">
                        אישור השאלה
                    </button>
                </div>
            </form>
        </dialog>

    </main>

    <script src="app.js"></script>
</body>
</html>
