
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>ניהול הגמ"ח</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>ניהול הגמ"ח</h1>
            <div id="userArea">
                <span id="welcomeText"></span>
                <button id="logoutBtn" class="secondary" hidden>
                    התנתקות
                </button>
            </div>
        </div>
    </header>

    <main class="container">

        <section id="authSection" class="auth-card">
            <h2>ברוכים הבאים</h2>
            <p class="muted">התחברו כדי לנהל השאלות ופריטים</p>

            <div class="tabs">
                <button id="loginTab" class="tab active">
                    התחברות
                </button>
                <button id="registerTab" class="tab">
                    הרשמה
                </button>
            </div>

            <form id="authForm">
                <div id="nameGroup" hidden>
                    <label for="fullName">שם מלא</label>
                    <input id="fullName" type="text">
                </div>

                <label for="email">כתובת אימייל</label>
                <input id="email" type="email" required>

                <label for="password">סיסמה</label>
                <input id="password" type="password" required>

                <button type="submit" class="primary full-width"
                        id="authSubmit">
                    התחברות
                </button>
            </form>

            <p id="authMessage" class="message"
               role="status" aria-live="polite"></p>
        </section>

        <button id="openLoginBtn" class="secondary">כניסה לבעלי גמ״חים</button>
        <section id="dashboardSection">
            <div class="page-heading">
                <div>
                    <h2>קטלוג הפריטים</h2>
                    <p class="muted">
                        חיפוש פריטים ושליחת בקשות השאלה
                    </p>
                </div>
            </div>

            <div class="toolbar">
                <input id="searchInput" type="search"
                       placeholder="חיפוש פריט...">

                <label class="checkbox-label">
                    <input id="availableOnly"
                           type="checkbox">
                    זמינים בלבד
                </label>

                <button id="searchBtn" class="primary">
                    חיפוש
                </button>
            </div>

            <p id="itemsMessage" class="message"
               role="status" aria-live="polite"></p>

            <div id="itemsGrid" class="items-grid"></div>

            <div class="pagination">
                <button id="prevPage" class="secondary">
                    הקודם
                </button>
                <span id="pageLabel">עמוד 1</span>
                <button id="nextPage" class="secondary">
                    הבא
                </button>
            </div>
        </section>

        <section id="ownerRequestsSection" hidden><h2>בקשות השאלה שממתינות לטיפולך</h2><p id="ownerRequestsMessage" class="message"></p><div id="ownerRequestsGrid" class="items-grid"></div></section>
        <dialog id="borrowDialog">
            <form id="borrowForm">
                <h2>בקשה להשאלת פריט</h2>
                <p id="borrowItemName"></p>

                <label for="applicantName">שם מלא</label><input id="applicantName" type="text" maxlength="100" required>
                <label for="applicantPhone">טלפון</label><input id="applicantPhone" type="tel" maxlength="30">
                <label for="applicantEmail">אימייל</label><input id="applicantEmail" type="email" maxlength="254">
                <p class="muted">יש להזין לפחות טלפון או אימייל.</p>

                <p id="borrowMessage" class="message"
                   role="status" aria-live="polite"></p>

                <div class="dialog-actions">
                    <button type="button" id="cancelBorrow"
                            class="secondary">
                        ביטול
                    </button>
                    <button type="submit" class="primary">
                        שליחת בקשה
                    </button>
                </div>
            </form>
        </dialog>

    </main>

    <script src="app.js"></script>
</body>
</html>
